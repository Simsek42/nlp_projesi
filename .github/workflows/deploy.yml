name: Watsons Sentiment CI/CD Pipeline

# Ana kola (main) kod gönderildiğinde veya PR açıldığında çalışır
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları sunucuya (GitHub Runner) indirir
    - name: Repo Klonlanıyor
      uses: actions/checkout@v4

    # 2. Python ortamını kurar
    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Bağımlılıkları yükler
    - name: Bağımlılıklar Yükleniyor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Docker ortamını hazırlar ve imajı build eder (Test amaçlı)
    - name: Docker İmajı Oluşturuluyor (Build Test)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # Şimdilik sadece test amaçlı build eder, Docker Hub'a yüklemez
        tags: watsons-sentiment-api:latest

    - name: CI/CD Süreci Başarıyla Tamamlandı 🎉
      run: echo "Kodlar test edildi ve Docker imajı hatasız şekilde derlendi!"